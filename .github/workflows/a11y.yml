# The accessibility gate.
#
# Separate from the engine tests on purpose: this one needs a browser and a dev
# server, and it is the only suite that can see how a screen behaves rather than
# how the config is shaped.
name: accessibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  a11y:
    name: axe-core + crisis path (${{ matrix.project }})
    runs-on: ubuntu-latest
    # One job per Playwright project, in parallel. The whole suite (756 tests by
    # 6.11.2026) needs about 45 minutes on one runner's two workers, so a single
    # job hit its 20-minute cap and was cancelled on every run from 1.10 on: 341
    # passed and none failed before the cut, but a cancelled gate is no gate.
    # Split four ways, each job runs about 190 tests: 8 to 17 minutes on the
    # first run (6.11), WebKit the slowest. The cap leaves room for the suite to
    # grow; when mobile-safari nears it, split that project by --shard.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, forced-colors, mobile, mobile-safari]

    # Playwright's own image, which ships both browser engines and every OS
    # library they need.
    #
    # This used to be a bare runner plus `playwright install --with-deps`. That
    # was fine while the suite was Chromium-only, but WebKit pulls a long list of
    # system libraries (gstreamer, libwoff, libenchant, libsecret, …), and the
    # apt step for them stalled for fourteen minutes and got killed by the job
    # timeout. Raising the timeout would only have bought a slower red run: the
    # install is the wrong thing to be doing on every push at all.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The image tag above is pinned by hand, so a dependency bump can silently
      # leave the browsers older than the library driving them. Playwright only
      # warns about that; here it should stop the build.
      - name: Fail if the image and the dependency have drifted apart
        run: |
          pinned=1.62.1
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$pinned" ]; then
            echo "::error::@playwright/test is $installed but this workflow pins the container to v$pinned. Bump the image tag in .github/workflows/a11y.yml to match."
            exit 1
          fi

      - name: Run the accessibility suite
        run: npm run test:a11y -- --project=${{ matrix.project }}

      # Uploaded even on failure — the report carries the axe findings, the
      # offending selectors and a trace for every failed screen.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

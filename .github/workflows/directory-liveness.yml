# Directory URL liveness — reports, never blocks. Decision D-7.
#
# Split from the blocking completeness check on purpose. MIELI ry's site being
# down for ten minutes must not stop us deploying a fix to Reitti, and a red
# check that is usually somebody else's outage is a check everyone learns to wave
# through. A dead link does not freeze a deploy; it is reported in STATUS.md on
# the status branch every morning (Amir, 12.11.2026), because /directory tells
# people every address is checked daily and a green run's log is read by nobody.
name: directory liveness

on:
  schedule:
    # Daily, early morning Helsinki time.
    - cron: '0 4 * * *'
  workflow_dispatch:

# Read-only by default. Only the report job, which installs and runs nothing
# from npm, may write, and it pushes only to the status branch.
permissions:
  contents: read

jobs:
  liveness:
    name: every directory URL still answers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      uploaded: ${{ steps.upload.outputs.artifact-id != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits 0 even when a URL is down: the output is the report, and a human
      # decides whether a service moved or is merely having a bad morning.
      - name: Check every directory URL
        run: npm run directory:verify -- --live --json "$RUNNER_TEMP/liveness.json"

      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: liveness
          path: ${{ runner.temp }}/liveness.json
          retention-days: 7

      # This one DOES block, and it is the opposite kind of check. A directory
      # link rotting is somebody else's site changing. The index setting flipping
      # on our own domain is ours, in both directions: the real domain falling
      # out of the index makes the site unfindable, and a preview deployment
      # entering it puts an older copy of unreviewed content in front of people.
      - name: The public domain is up, canonical, and indexed as intended
        run: npm run domain:verify

  # The report lands in STATUS.md on the status branch, the file the builder
  # and Amir's orchestrator read. If it cannot be pushed the job goes red: a
  # report that silently did not arrive is the failure this exists to stop.
  # Its own job so the write token never meets `npm ci`: plain node, our script.
  report:
    name: report the result in STATUS.md (status branch)
    needs: liveness
    # Also when domain:verify failed: the link results are still worth reporting.
    # Not when the check never produced results: that job's own red is the
    # report, and the section's stale date says the check did not run.
    if: ${{ !cancelled() && needs.liveness.outputs.uploaded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: liveness
          path: ${{ runner.temp }}

      - name: Write the section and push it to the status branch
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin status
          wt="$RUNNER_TEMP/status"
          git worktree add -q --detach "$wt" origin/status
          for attempt in 1 2 3; do
            node scripts/liveness-status.mjs write "$RUNNER_TEMP/liveness.json" "$wt/STATUS.md" "$RUN_URL" > "$RUNNER_TEMP/section.md"
            git -C "$wt" add -f STATUS.md
            git -C "$wt" diff --cached --quiet || git -C "$wt" commit -q -m "Directory liveness $(date -u +%F)"
            if git -C "$wt" push -q origin HEAD:status; then
              cat "$RUNNER_TEMP/section.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git -C "$wt" fetch -q origin status
            git -C "$wt" reset -q --hard origin/status
          done
          echo "::error::could not push the liveness report to the status branch"
          exit 1

# The engine gate.
#
# CLAUDE.md says the safety invariants "must be green before any commit", but
# until now nothing enforced that: the accessibility workflow was the only one
# running, so `packages/engine/test/invariants.test.ts` — the suite that proves
# invariants 1–6 hold in the config and the pure logic — could go red unnoticed.
#
# No browser and no dev server here on purpose. The engine is pure; keeping this
# job fast is what makes it reasonable to run on every push.
name: engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: invariants + scoring + routing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests and safety invariants
        run: npm test

      # Blocking, because a missing field is our bug: an entry without hours,
      # anonymity, who-answers or a verification date sends somebody to a service
      # without telling them what they are walking into. Offline and
      # deterministic, so it cannot be red for someone else's reason.
      - name: Directory completeness
        run: npm run directory:verify

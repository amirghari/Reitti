<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab shows the name and nothing else. The sentence that used to
         follow it lives in the meta description, where a search result can use
         it, rather than being truncated in a 20-character tab. -->
    <title>Mielenreitti</title>
    <meta
      name="description"
      content="Mielenreitti shows you what mental-health support exists in Finland, what it costs, and how to reach it. Free, no account, nothing stored."
    />

    <!--
      The `noindex` meta tag was removed on 2026-09-21 (D-25): mielenreitti.fi is
      open to search engines, on the product owner's decision, with the preview
      banner still running on every screen.

      There is deliberately no tag here for the preview hosts either. This file is
      static and is served byte-for-byte to every host the deployment answers on,
      so it cannot say one thing on mielenreitti.fi and another on
      reitti-seven.vercel.app. Those hosts are kept out of the index by the
      X-Robots-Tag header in vercel.json, which is conditioned on the host and is
      the stronger signal anyway: robots.txt asks a crawler not to *fetch* a page,
      while X-Robots-Tag tells it not to *index* one it has.
    -->

    <!--
      The icon is the wordmark glyph and nothing else: `.wordmark-glyph` is a
      square of `--accent` with a 7/22 corner radius. Both are generated from
      that CSS token by `npm run favicon:build`, so the brand colour has one
      source of truth and the icon cannot quietly stop matching the header.

      SVG first for browsers that take it, .ico for the ones that do not. The
      Apple touch icon is a flat opaque square because iOS applies its own
      squircle mask and would round already-rounded corners twice.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4a6e5a" />

    <!-- The apex is canonical; www 308s to it at the edge. -->
    <link rel="canonical" href="https://mielenreitti.fi/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reitti — find the right kind of help</title>
    <meta
      name="description"
      content="Reitti helps you find the right kind of mental health support, at the right level, at a cost that works. Your answers stay on your device."
    />

    <!--
      This build carries clinical routing content that no clinician has signed
      off, and it is publicly reachable. Keeping it out of search indexes is the
      cheapest thing standing between a person searching for mental-health help
      and a provisional answer presented as a real one.

      Belt and braces: this tag, an X-Robots-Tag header in vercel.json for
      responses a crawler takes without parsing HTML, and robots.txt. Remove all
      three together, and only once the clinical content is signed off.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      The icon is the wordmark glyph and nothing else: `.wordmark-glyph` is a
      square of `--accent` with a 7/22 corner radius. Both are generated from
      that CSS token by `npm run favicon:build`, so the brand colour has one
      source of truth and the icon cannot quietly stop matching the header.

      SVG first for browsers that take it, .ico for the ones that do not. The
      Apple touch icon is a flat opaque square because iOS applies its own
      squircle mask and would round already-rounded corners twice.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4a6e5a" />

    <!-- The apex is canonical; www 308s to it at the edge. -->
    <link rel="canonical" href="https://mielenreitti.fi/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
